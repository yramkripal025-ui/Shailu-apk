<style>
  :root{
    --paper:#EFF3F0;
    --card:#FFFFFF;
    --ink:#152220;
    --ink-soft:#4B5C57;
    --line:#DDE5DF;
    --brand:#124B44;
    --brand-2:#1B6E63;
    --paid:#227A4E;
    --paid-bg:#E7F5EC;
    --due:#B4602A;
    --due-bg:#FBEEE2;
    --penalty:#A5372E;
    --penalty-bg:#FAEAE8;
    --gold:#B8923B;
    --radius-card: 14px;
    --radius-pill: 999px;
    --muted: var(--ink-soft);
    --border: var(--line);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);position:relative;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;font-weight:600;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  input,select,textarea{font-family:inherit;}

  /* ---- Top bar ---- */
  .topbar{
    background:var(--brand);
    color:#fff;
    padding:18px 18px 22px;
    border-radius:0 0 22px 22px;
  }
  .topbar-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .topbar h1{font-size:22px;color:#fff;}
  .topbar .date{font-size:12.5px;color:#B9D6CE;margin-top:2px;}
  .topbar-stats{display:flex;gap:10px;margin-top:16px;}
  .tstat{flex:1;background:rgba(255,255,255,0.08);border-radius:12px;padding:10px 12px;}
  .tstat .lbl{font-size:10.5px;color:#BFE0D8;text-transform:uppercase;letter-spacing:.04em;}
  .tstat .val{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-top:3px;color:#fff;}

  /* ---- Content ---- */
  .content{flex:1;padding:16px 16px calc(90px + env(safe-area-inset-bottom));}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:18px 0 8px;}
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:14px;
    margin-bottom:10px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card .lbl{font-size:11.5px;color:var(--ink-soft);}
  .stat-card .val{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-top:4px;}

  .empty{
    text-align:center;color:var(--ink-soft);font-size:13.5px;padding:26px 10px;
  }

  /* customer row */
  .crow{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .crow .name{font-weight:600;font-size:15px;}
  .crow .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .amt{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:var(--radius-pill);font-weight:600;letter-spacing:.02em;}
  .badge.paid{background:var(--paid-bg);color:var(--paid);}
  .badge.due{background:var(--due-bg);color:var(--due);}
  .badge.penalty{background:var(--penalty-bg);color:var(--penalty);}

  .btnrow{display:flex;gap:8px;margin-top:10px;}
  .btn{border:none;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;flex:1;text-align:center;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-wa-paid{background:var(--paid-bg);color:var(--paid);}
  .btn-wa-due{background:var(--due-bg);color:var(--due);}
  .btn-small{padding:7px 10px;font-size:12px;}
  .btn-danger{background:var(--penalty-bg);color:var(--penalty);}
  .btn:disabled{opacity:.5;cursor:wait;pointer-events:none;}

  input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
    font-size:14.5px;background:#fff;color:var(--ink);margin-top:5px;
  }
  label{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:block;margin-top:12px;}
  label:first-child{margin-top:0;}

  /* bottom nav */
  .navbar{
    position:fixed;bottom:0;left:0;right:0;
    max-width:480px;margin:0 auto;
    background:#fff;border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .navitem{touch-action:manipulation;-webkit-user-select:none;user-select:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;border:none;background:none;color:var(--ink-soft);font-size:9.5px;font-weight:600;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .navitem.active{color:var(--brand);background:var(--paid-bg);}
  .navitem .ic{font-size:18px;}

  /* fab */
  .fab{
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
    position:fixed;right:calc(50% - 240px + 18px);bottom:78px;
    width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;
    border:none;font-size:26px;box-shadow:0 6px 16px rgba(18,75,68,.35);z-index:21;
  }
  @media (max-width:520px){ .fab{right:18px;} }

  /* search */
  .searchbar{display:flex;gap:8px;margin-bottom:10px;}
  .searchbar input{flex:1;margin:0;}
  .filterrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;}
  .chip{flex-shrink:0;padding:6px 12px;border-radius:var(--radius-pill);border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}

  /* overlay / modal */
  .overlay{
    position:fixed;inset:0;background:rgba(15,25,22,.45);z-index:30;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--paper);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .closebtn{border:none;background:var(--line);width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--ink);}

  .fullview{position:fixed;inset:0;background:var(--paper);z-index:25;max-width:480px;margin:0 auto;overflow-y:auto;}
  .fv-header{background:var(--brand);color:#fff;padding:16px;display:flex;align-items:center;gap:10px;border-radius:0 0 18px 18px;}
  .backbtn{border:none;background:rgba(255,255,255,.12);color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;}
  .fv-body{padding:14px 16px calc(90px + env(safe-area-inset-bottom));}

  .txn{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .txn:last-child{border-bottom:none;}
  .txn .tl{color:var(--ink-soft);}

  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;
    max-width:85%;text-align:center;
  }
  .banner{background:var(--due-bg);color:var(--due);padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px;}
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--ink-soft);font-size:14px;}
  a.wa-link{text-decoration:none;}
  .helpline{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  .feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .feature-btn{min-height:46px;}
  .loan-tag{font-size:10.5px;padding:2px 7px;border-radius:999px;background:#EEF3F0;color:var(--ink-soft);display:inline-block;margin-left:4px;}
  .day-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .day-row:last-child{border-bottom:none;}
  .msg-preview{white-space:pre-line;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;line-height:1.45;}
  .danger-note{background:var(--penalty-bg);color:var(--penalty);border-radius:10px;padding:9px;font-size:11.5px;}

  .last15-card{padding:0;overflow:hidden;}
  .last15-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;padding:14px 16px;color:var(--ink);font:700 17px Inter,system-ui,sans-serif;cursor:pointer;text-align:left;}
  .last15-plus{font-size:25px;line-height:1;font-weight:500;color:var(--muted);}
  .last15-body{display:none;padding:0 14px 12px;}
  .last15-card.open .last15-body{display:block;}
  .last15-card.open .last15-plus{transform:rotate(45deg);}
  .last15-card .day-row{margin:0;border-top:1px solid rgba(20,70,63,.08);padding:11px 2px;}

</style>

<body>
<div id="root" class="app"><div class="loading">Loading your ledger...</div></div>

<script>
(function(){
"use strict";

/* ============================= STORAGE LAYER (IndexedDB) ============================= */
var DB_NAME = "DailyCollectionDB";
var STORE_NAME = "ledgers";
var DB_VERSION = 1;
var dbInstance = null;
var usingFallback = false;
var memoryFallback = null;

function openDB(){
  return new Promise(function(resolve, reject){
    if (!window.indexedDB){
      usingFallback = true;
      return resolve(null);
    }
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = function(){
      usingFallback = true;
      resolve(null);
    };
    req.onsuccess = function(e){
      dbInstance = e.target.result;
      resolve(dbInstance);
    };
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)){
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

function defaultData(){
  return {
    customers: [],
    transactions: {},
    // Dashboard payment status is intentionally separate from Ledger transactions.
    // Home-screen Mark as Paid/Unpaid never writes to DATA.transactions.
    dashboardPayments: {},
    trash: [],
    expenses: [],
    expenseTrash: [],
    settings: { 
      penaltyPerDay: 0, 
      countryCode: "91",
      waPaidTemplate: "Payment received — thank you, {name}!\nAmount received: {amount}\nDate: {date}\nRemaining balance: {balance}\nRemaining days: {days}",
      waDueTemplate: "Reminder for {name}:\nToday's due amount: {due}\nTotal amount due with penalties: {totalDue}\nPlease clear the pending amount at your earliest convenience.",
      defaultCollectionNumber: ""
    },
    version: 5,
    nextBookNo: 1
  };
}

async function loadData(){
  await openDB();
  if (dbInstance && !usingFallback){
    return new Promise(function(resolve){
      try {
        var tx = dbInstance.transaction(STORE_NAME, "readonly");
        var store = tx.objectStore(STORE_NAME);
        var req = store.get("appdata");
        req.onsuccess = function(){
          if (req.result) {
            var data = req.result;
            if (!data.settings) data.settings = defaultData().settings;
            if (!data.dashboardPayments) data.dashboardPayments = {};
            if (!data.trash) data.trash = [];
            if (!data.expenses) data.expenses = [];
            if (!data.expenseTrash) data.expenseTrash = [];
            if (!data.settings.waPaidTemplate) data.settings.waPaidTemplate = defaultData().settings.waPaidTemplate;
            if (!data.settings.waDueTemplate) data.settings.waDueTemplate = defaultData().settings.waDueTemplate;
            resolve(data);
          } else {
            resolve(defaultData());
          }
        };
        req.onerror = function(){ resolve(defaultData()); };
      } catch(err){
        resolve(defaultData());
      }
    });
  } else {
    usingFallback = true;
    if (!memoryFallback) memoryFallback = defaultData();
    if (!memoryFallback.dashboardPayments) memoryFallback.dashboardPayments = {};
    if (!memoryFallback.trash) memoryFallback.trash = [];
    if (!memoryFallback.expenses) memoryFallback.expenses = [];
    if (!memoryFallback.expenseTrash) memoryFallback.expenseTrash = [];
    return memoryFallback;
  }
}

async function saveData(data){
  if (dbInstance && !usingFallback){
    return new Promise(function(resolve){
      try {
        var tx = dbInstance.transaction(STORE_NAME, "readwrite");
        var store = tx.objectStore(STORE_NAME);
        var req = store.put(data, "appdata");
        req.onsuccess = function(){ resolve(true); };
        req.onerror = function(){ 
          showToast("Storage error — check browser permissions");
          resolve(false); 
        };
        tx.onerror = function(){ resolve(false); };
        tx.onabort = function(){ resolve(false); };
      } catch(e){
        console.error("saveData failed:", e);
        resolve(false);
      }
    });
  } else {
    memoryFallback = data;
    return true;
  }
}

/* ============================= APP STATE ============================= */
var DATA = null;
var VIEW = "home";
var VIEW_PARAM = null;
var CUSTOMER_FILTER = "all";
var SEARCH_Q = "";
var HISTORY_Q = "";
var SAVING_LOCK = false;
var MUTATION_LOCK = false;
var MAX_MONEY_AMOUNT = 10000000; // ₹1 crore safety ceiling for accidental-entry protection

function beginMutation(){ if (MUTATION_LOCK) return false; MUTATION_LOCK = true; return true; }
function endMutation(){ MUTATION_LOCK = false; }
function validMoneyAmount(n, allowZero){
  var x = Number(n);
  return isFinite(x) && x >= (allowZero ? 0 : 0.01) && x <= MAX_MONEY_AMOUNT;
}
var REPORTS_MONTH = todayISO().slice(0,7); 
var REPORT_DAY = todayISO();
var MESSAGE_REPORT_DATE = todayISO();
var CUSTOMER_LIST_LIMIT = 50; 
var COLLECTION_MSG_TYPE = "full"; // "full" = poora summary, "simple" = sirf collected amount

/* ============================= HELPERS ============================= */
function uid(prefix){
  return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
}
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function inr(n){
  n = round2(n||0);
  return "₹" + n.toLocaleString("en-IN", {maximumFractionDigits:2, minimumFractionDigits: (n%1!==0)?2:0});
}
function todayISO(){
  var d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}
function dueDateForDay(customer, dayNumber){
  if(!customer || !customer.startDate || !dayNumber) return "—";
  var d = new Date(customer.startDate + "T00:00:00");
  if(isNaN(d.getTime())) return "—";
  d.setDate(d.getDate() + (Number(dayNumber) - 1));
  return fmtDate(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
}
function fmtDateTime(ts){
  var d = new Date(ts);
  return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"}) + ", " + d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function cleanMobile(m, countryCode){
  var digits = String(m||"").replace(/\D/g,"");
  if (digits.length === 10) digits = (countryCode||"91") + digits;
  return digits;
}
function validateMobile(m){
  var digits = String(m||"").replace(/\D/g,"");
  return /^\d{10}$/.test(digits);
}
function sanitizeDateStr(s, fallback){
  // Guards against corrupted/malformed dates from an imported file (bad Excel
  // cell, hand-edited backup, etc.) turning into "Invalid Date" / NaN day
  // counts throughout computeStats(). Falls back to today's date when the
  // value isn't a real, parseable calendar date.
  var str = String(s || "").trim();
  var m2 = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m2){
    var d = new Date(str.slice(0,10) + "T00:00:00");
    if (!isNaN(d.getTime())) return str.slice(0,10);
  }
  return fallback;
}

/* ============================= BUSINESS LOGIC ============================= */
function twentyPercentCut(principal){
  return round2(principal * 0.20);
}

function isFivePlan(customer){
  return Number(customer.principal) === 5000 && Number(customer.period) === 30;
}

function reversedTransactionIds(txns){
  var ids = {};
  (txns || []).forEach(function(t){
    if (t && t.isCorrection && t.reversalForId) ids[t.reversalForId] = true;
  });
  return ids;
}

/*
 * A payment is either active, explicitly marked unpaid, or a legacy correction.
 * New Mark-Unpaid actions never create negative/correction transactions.
 * Legacy correction rows are still understood so old data does not corrupt the
 * ledger: the original payment referenced by reversalForId is ignored too.
 */
function effectiveTransactions(txns){
  txns = txns || [];
  var reversed = reversedTransactionIds(txns);
  return txns.filter(function(t){
    if (!t || t.isCorrection) return false;
    if (t.isUnpaid === true) return false;
    if (reversed[t.id]) return false;
    return true;
  });
}

function effectiveTransactionIds(txns){
  var out = {};
  effectiveTransactions(txns).forEach(function(t){ out[t.id] = true; });
  return out;
}

function computeStats(customer, txns, settings){
  txns = txns || [];
  var start = startOfDay(new Date(customer.startDate + "T00:00:00"));
  var today = startOfDay(new Date());
  var diffDays = Math.floor((today - start) / 86400000);
  var hasStarted = diffDays >= 0;
  var currentDayNumber = Math.min(Math.max(diffDays + 1, 1), customer.period);

  // Only effective payments count toward the ledger. Mark-Unpaid flags a
  // payment as inactive; legacy negative correction rows are ignored and the
  // payment they reference is also excluded by effectiveTransactions().
  var effectiveTxns = effectiveTransactions(txns);
  var dayCollected = {};
  effectiveTxns.forEach(function(t){
    dayCollected[t.dayNumber] = round2((dayCollected[t.dayNumber] || 0) + (t.amountPaid || 0));
  });

  // A day only counts as fully settled once its full daily amount has been
  // collected for it — a partial payment leaves the shortfall pending
  // instead of quietly marking the whole day as done. (0.004 guards against
  // floating-point rounding dust, e.g. 3 x 33.33 landing at 99.99.)
  var paidSet = {};
  Object.keys(dayCollected).forEach(function(dayNum){
    if (dayCollected[dayNum] + 0.004 >= customer.dailyAmount) paidSet[dayNum] = true;
  });

  var totalCollected = round2(effectiveTxns.reduce(function(s,t){ 
    return s + (t.amountPaid||0); 
  }, 0));

  var totalPenaltyPaid = round2(effectiveTxns.reduce(function(s,t){ return s + (t.penaltyPaid||0); }, 0));
  var paidDaysCount = Object.keys(paidSet).length;

  var pendingDayNumbers = [];
  var pendingDayShortfall = {}; // dayNumber -> amount still owed for that specific day
  if (hasStarted){
    for (var d=1; d<=currentDayNumber; d++){
      if (!paidSet[d]){
        pendingDayNumbers.push(d);
        pendingDayShortfall[d] = Math.max(0, round2(customer.dailyAmount - (dayCollected[d] || 0)));
      }
    }
  }
  var lateDayNumbers = pendingDayNumbers.filter(function(d){ return d < currentDayNumber; });
  var lateDays = lateDayNumbers.length;
  var todaysDue = pendingDayNumbers.indexOf(currentDayNumber) !== -1;

  var backlogAmount = round2(lateDayNumbers.reduce(function(sum, d){ return sum + pendingDayShortfall[d]; }, 0));
  var todaysDueAmount = round2((todaysDue ? pendingDayShortfall[currentDayNumber] : 0) + backlogAmount);
  // Per-customer penalty rate wins if the customer has one set; otherwise fall back to the global settings rate.
  var effectivePenaltyRate = (customer.penaltyPerDay != null && customer.penaltyPerDay !== "")
    ? Number(customer.penaltyPerDay) : (settings.penaltyPerDay || 0);
  var penaltyDue = round2(lateDays * effectivePenaltyRate);
  var totalPending = Math.max(0, round2(customer.principal - totalCollected));
  var totalOutstanding = round2(totalPending + penaltyDue);
  var remainingDays = Math.max(0, customer.period - paidDaysCount);
  var daysAfterToday = Math.max(0, customer.period - currentDayNumber);
  var futureScheduled = round2(daysAfterToday * customer.dailyAmount);
  var isCompleted = paidDaysCount >= customer.period;

  return {
    hasStarted: hasStarted,
    currentDayNumber: currentDayNumber,
    paidSet: paidSet,
    pendingDayNumbers: pendingDayNumbers,
    pendingDayShortfall: pendingDayShortfall,
    paidDaysCount: paidDaysCount,
    totalCollected: totalCollected,
    totalPenaltyPaid: totalPenaltyPaid,
    lateDays: lateDays,
    todaysDue: todaysDue,
    todaysDueAmount: todaysDueAmount,
    backlogAmount: backlogAmount,
    penaltyDue: penaltyDue,
    effectivePenaltyRate: effectivePenaltyRate,
    totalPending: totalPending,
    totalOutstanding: totalOutstanding,
    remainingDays: remainingDays,
    futureScheduled: futureScheduled,
    isCompleted: isCompleted
  };
}

function activeCustomers(){
  return DATA.customers.filter(function(c){ return c.archived !== true; });
}

/* ============================= EXPENSE DIARY ============================= */
async function addExpense(name, amount){
  if (!beginMutation()) return null;
  try{
    var n = round2(Number(amount));
    if (!String(name||"").trim() || !validMoneyAmount(n, false)){
      showToast("Enter a valid expense amount (up to ₹1 crore).");
      return null;
    }
    if (!DATA.expenses) DATA.expenses = [];
    var e = { id: uid("exp"), name: name.trim(), amount: n, date: todayISO(), timestamp: Date.now() };
    DATA.expenses.push(e);
    var saved = await saveData(DATA);
    if (!saved){ DATA.expenses.pop(); return null; }
    return e;
  } finally { endMutation(); }
}

/* ============================= MUTATIONS ============================= */
function normalizePenaltyOverride(v){
  // "" / null / undefined means "use the global default rate from Settings".
  if (v === "" || v === null || v === undefined) return null;
  var n = parseFloat(v);
  return (isNaN(n) || n < 0) ? null : round2(n);
}

async function addCustomer(payload){
  if (!beginMutation()) return null;
  try{
    var principal = round2(Number(payload.principal));
    var daily = round2(Number(payload.dailyAmount));
    if (!String(payload.name||"").trim() || !validateMobile(payload.mobile) || !validMoneyAmount(principal,false) || !validMoneyAmount(daily,false)){
      showToast("Please enter valid customer details and amounts (maximum ₹1 crore).");
      return null;
    }
    var c = {
      id: uid("cust"),
      personId: payload.personId || ('person_' + String(payload.mobile||'').replace(/\D/g,'') + '_' + Date.now()),
      bookId: uid("book"),
      bookNo: nextBookNumber ? nextBookNumber() : ('BOOK-' + Date.now()),
      bookTitle: payload.bookTitle || 'Loan / Book',
      name: payload.name.trim(), mobile: String(payload.mobile || "").replace(/\D/g, "").slice(0, 10), principal: principal,
      startDate: sanitizeDateStr(payload.startDate, todayISO()),
      period: Math.max(1, Math.round(payload.period) || 1), dailyAmount: daily,
      penaltyPerDay: normalizePenaltyOverride(payload.penaltyPerDay), notes: payload.notes ? payload.notes.trim() : "",
      status: "active", archived: false, createdAt: Date.now()
    };
    DATA.customers.push(c); DATA.transactions[c.id] = [];
    var saved = await saveData(DATA);
    if (!saved){ DATA.customers.pop(); delete DATA.transactions[c.id]; return null; }
    return c;
  } finally { endMutation(); }
}

async function updateCustomer(id, payload){
  var c = DATA.customers.find(function(x){ return x.id === id; });
  if (!c) return false;
  c.name = payload.name.trim();
  c.mobile = String(payload.mobile || "").replace(/\D/g, "").slice(0, 10);
  c.dailyAmount = Math.max(0, round2(payload.dailyAmount) || 0);
  c.notes = payload.notes ? payload.notes.trim() : "";
  if (payload.principal !== undefined) c.principal = Math.max(0, round2(payload.principal) || 0);
  if (payload.period !== undefined) c.period = Math.max(1, Math.round(payload.period) || 1);
  if (payload.startDate) c.startDate = sanitizeDateStr(payload.startDate, c.startDate);
  if (payload.penaltyPerDay !== undefined) c.penaltyPerDay = normalizePenaltyOverride(payload.penaltyPerDay);
  await saveData(DATA);
  return true;
}

async function archiveCustomer(id, archived){
  if (!beginMutation()) return false;
  try{
    var c = DATA.customers.find(function(x){ return x.id === id; });
    if (!c) return false;
    var old = c.archived; c.archived = archived;
    var saved = await saveData(DATA);
    if (!saved) c.archived = old;
    return !!saved;
  } finally { endMutation(); }
}

async function moveToTrash(customerId){
  var idx = DATA.customers.findIndex(function(x){ return x.id === customerId; });
  if (idx === -1) return {ok:false, reason:"not_found"};
  var removed = DATA.customers.splice(idx, 1)[0];
  if (!DATA.trash) DATA.trash = [];
  DATA.trash.push({
    customer: removed,
    transactions: DATA.transactions[customerId] || [],
    deletedAt: Date.now()
  });
  delete DATA.transactions[customerId];
  var saved = await saveData(DATA);
  if (!saved){
    // Roll back in-memory changes if persistence failed.
    DATA.trash.pop();
    DATA.customers.splice(idx, 0, removed);
    DATA.transactions[customerId] = DATA.transactions[customerId] || [];
    return {ok:false, reason:"save_failed"};
  }
  return {ok:true};
}

async function restoreFromTrash(index){
  if (!DATA.trash || !DATA.trash[index]) return {ok:false, reason:"not_found"};
  var item = DATA.trash.splice(index, 1)[0];
  DATA.customers.push(item.customer);
  DATA.transactions[item.customer.id] = item.transactions || [];
  var saved = await saveData(DATA);
  if (!saved){
    DATA.customers = DATA.customers.filter(function(c){ return c.id !== item.customer.id; });
    delete DATA.transactions[item.customer.id];
    DATA.trash.splice(index, 0, item);
    return {ok:false, reason:"save_failed"};
  }
  return {ok:true};
}

async function deletePermanently(index){
  if (!DATA.trash || !DATA.trash[index]) return {ok:false, reason:"not_found"};
  var removed = DATA.trash.splice(index, 1)[0];
  var saved = await saveData(DATA);
  if (!saved){
    DATA.trash.splice(index, 0, removed);
    return {ok:false, reason:"save_failed"};
  }
  return {ok:true};
}

async function markPaid(customerId, amountReceived, penaltyReceived){
  if (SAVING_LOCK) return {ok:false};
  SAVING_LOCK = true;
  try{
    var c = DATA.customers.find(function(x){ return x.id === customerId; });
    if (!c) return {ok:false};
    var txns = DATA.transactions[c.id] || (DATA.transactions[c.id] = []);
    var s = computeStats(c, txns, DATA.settings);

    if (!s.pendingDayNumbers.length && s.isCompleted){
      showToast("Nothing pending to mark paid for " + c.name + " — plan is already completed.");
      return {ok:false};
    }

    var remaining = round2(amountReceived);
    if (!validMoneyAmount(remaining,false) || !validMoneyAmount(penaltyReceived || 0,true)){
      showToast("Amount is outside the allowed safety range (maximum ₹1 crore).");
      return {ok:false};
    }
    if (!remaining || remaining <= 0){
      showToast("Enter an amount greater than zero.");
      return {ok:false};
    }

    // Fresh day -> collected map covering the WHOLE plan (not just up to
    // today), so that if the amount received is more than what's due, the
    // extra rolls forward into future days as an advance instead of being
    // silently dropped.
    var dayCollected = {};
    effectiveTransactions(txns).forEach(function(t){
      dayCollected[t.dayNumber] = round2((dayCollected[t.dayNumber] || 0) + (t.amountPaid || 0));
    });

    var candidateDays = s.pendingDayNumbers.slice();
    for (var d = s.currentDayNumber + 1; d <= c.period; d++){ candidateDays.push(d); }

    var settledDays = [];
    var advanceDays = [];
    var createdTxns = [];
    for (var i=0; i<candidateDays.length && remaining > 0; i++){
      var dayNum = candidateDays[i];
      var collectedSoFar = dayCollected[dayNum] || 0;
      var owed = Math.max(0, round2(c.dailyAmount - collectedSoFar));
      if (owed <= 0) continue;
      var portion = round2(Math.min(remaining, owed));
      if (portion <= 0) continue;
      remaining = round2(remaining - portion);
      dayCollected[dayNum] = round2(collectedSoFar + portion);
      var isAdvance = dayNum > s.currentDayNumber;
      var tx = {
        id: uid("txn"),
        dayNumber: dayNum,
        amountPaid: portion,
        penaltyPaid: 0,
        date: todayISO(),
        timestamp: Date.now()
      };
      // Keep the existing allocation rules intact, but make the payment type
      // explicit in history so late and partial payments remain easy to audit.
      // A payment can be both late and partial.
      var isPartial = (portion + 0.004 < owed);
      var isLate = dayNum < s.currentDayNumber;
      if (isAdvance) {
        tx.note = "Advance payment";
      } else if (isLate && isPartial) {
        tx.note = "Late + partial payment";
      } else if (isLate) {
        tx.note = "Late payment";
      } else if (isPartial) {
        tx.note = "Partial payment";
      }
      txns.push(tx);
      createdTxns.push(tx);
      settledDays.push(dayNum);
      if (isAdvance) advanceDays.push(dayNum);
    }

    if (penaltyReceived && penaltyReceived > 0){
      if (createdTxns.length){
        createdTxns[createdTxns.length-1].penaltyPaid = round2(penaltyReceived);
      } else {
        // No day left to attach it to (plan fully paid up) — still record the penalty on its own.
        txns.push({
          id: uid("txn"), dayNumber: s.currentDayNumber, amountPaid: 0,
          penaltyPaid: round2(penaltyReceived), date: todayISO(), timestamp: Date.now()
        });
        createdTxns.push(true);
      }
    }

    if (!createdTxns.length){
      showToast("Nothing to record — " + c.name + "'s plan is already fully paid up.");
      return {ok:false};
    }

    await saveData(DATA);
    return {ok:true, settledDays: settledDays, advanceDays: advanceDays, leftoverAdvance: remaining};
  } finally {
    SAVING_LOCK = false;
  }
}

function dashboardDueAmount(c, s){
  if (!c || !s || !s.hasStarted) return 0;
  var day = Number(s.currentDayNumber||0);
  var period = Number(c.period||0);
  if (day < 1 || day > period) return 0;
  return round2(c.dailyAmount||0);
}
function dashboardIsDue(c,s){
  return dashboardDueAmount(c,s) > 0.004;
}
function dashboardPaymentKey(c, s){
  return String(c.id) + "|" + todayISO() + "|" + String(s.currentDayNumber);
}
function getDashboardPayment(c, s){
  if (!DATA.dashboardPayments) DATA.dashboardPayments = {};
  return DATA.dashboardPayments[dashboardPaymentKey(c,s)] || null;

  var p=getDashboardPayment(c,s);
  return !!(p && p.status==="paid" && Number(p.amount||0)>0);

  };

function waLink(mobile, message){
  var digits = String(mobile||"").replace(/\D/g,"");
  if (!/^\d{10}$/.test(digits)){
    return "javascript:(function(){alert('Please enter a valid 10-digit Indian mobile number before using WhatsApp.');})()";
  }
  var num = cleanMobile(digits, DATA.settings.countryCode);
  return "https://wa.me/" + num + "?text=" + encodeURIComponent(message);
}

function formatWaTemplate(template, data){
  var text = template || "";
  for (var key in data){
    text = text.replace(new RegExp("\\{" + key + "\\}", "g"), data[key]);
  }
  return text;
}

function waPaidMessage(c, stats, agg){
  var data = {
    name: c.name,
    amount: inr(agg ? agg.amountPaid : 0),
    date: fmtDate(todayISO()),
    balance: inr(stats.totalOutstanding),
    days: stats.remainingDays,
    penalty: inr(agg ? agg.penaltyPaid || 0 : 0)
  };
  var template = DATA.settings.waPaidTemplate || defaultData().settings.waPaidTemplate;
  return formatWaTemplate(template, data);
}

function waDueMessage(c, stats){
  var totalDueWithPenalty = round2(stats.todaysDueAmount + stats.penaltyDue);
  var data = {
    name: c.name,
    due: inr(stats.todaysDueAmount),
    lateDays: stats.lateDays,
    penalty: inr(stats.penaltyDue),
    totalDue: inr(totalDueWithPenalty)
  };
  var template = DATA.settings.waDueTemplate || defaultData().settings.waDueTemplate;
  return formatWaTemplate(template, data);
}

function expenseWaMessage(){
  var list = DATA.expenses || [];

  var todayTotal = round2(todayList.reduce(function(s,e){ return s + e.amount; }, 0));
  var overallTotal = round2(list.reduce(function(s,e){ return s + e.amount; }, 0));

  var lines = ["Expense Summary — " + fmtDate(todayISO())];
  if (todayList.length){
    todayList.forEach(function(e){ lines.push("• " + e.name + ": " + inr(e.amount)); });
  } else {
    lines.push("No expenses recorded today.");
  }
  lines.push("Today's Total: " + inr(todayTotal));
  lines.push("Overall Total: " + inr(overallTotal));
  return lines.join("\n");
}

async function copyTextToClipboard(text){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e){ /* fall through to legacy method */ }
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e){
    return false;
  }
}

/* ============================= ROBUST ROUTER & UNIVERSAL BACK SUPPORT ============================= */
var PAY_MODAL_OPEN = false; // tracks the Mark-as-Paid modal, which lives outside #root
var REMIND_MODAL_OPEN = false; // tracks the Send Reminders modal, which lives outside #root
var UNPAID_CONFIRM_OPEN = false; // tracks the Mark Unpaid confirmation modal, which lives outside #root

function closeAnyStrayModal(){
  // Safety net: if a modal element is still in the DOM (e.g. after a render()
  // triggered elsewhere while it was open), remove it so it never gets stuck
  // on screen. #root's own overlays are cleared automatically by render().
  var pay = document.getElementById("payOverlay");
  if (pay){ pay.remove(); }
  PAY_MODAL_OPEN = false;
  var remind = document.getElementById("remindOverlay");
  if (remind){ remind.remove(); }
  REMIND_MODAL_OPEN = false;
  var unpaidConfirm = document.getElementById("unpaidConfirmOverlay");
  if (unpaidConfirm){ unpaidConfirm.remove(); }
  UNPAID_CONFIRM_OPEN = false;
  var dashboardPay = document.getElementById("dashboardPayOverlay");
  if (dashboardPay){ dashboardPay.remove(); }
  var dashboardUnpaid = document.getElementById("dashboardUnpaidOverlay");
  if (dashboardUnpaid){ dashboardUnpaid.remove(); }
  var duePayment = document.getElementById("duePaymentOverlay");
  if (duePayment){ duePayment.remove(); }
}

function setView(view, param, pushHistory = true){
  closeAnyStrayModal();
  VIEW = view; VIEW_PARAM = param;
  if (pushHistory) {
    try {
      history.pushState({view: view, param: param}, "", "");
    } catch(e){}
  }
  render();
  window.scrollTo(0,0);
}

/* Android/Cordova back-button fallback: keep the existing view/history logic intact. */
document.addEventListener("backbutton", function(){
  try { history.back(); } catch(e) {
    VIEW = "home"; VIEW_PARAM = null;
    try { render(); } catch(_) {}
  }
});

/* Capacitor Android hardware-back support. The @capacitor/app plugin is
 * optional in the browser; when present in the Android build it delegates the
 * system Back button into the same router used by the web Back button. */
(function setupCapacitorBack(){
  try {
    var cap = window.Capacitor;
    var appPlugin = cap && cap.Plugins && cap.Plugins.App;
    if (appPlugin && typeof appPlugin.addListener === "function"){
      appPlugin.addListener("backButton", function(){
        try {
          if (VIEW !== "home" || VIEW_PARAM !== null || PAY_MODAL_OPEN || REMIND_MODAL_OPEN || UNPAID_CONFIRM_OPEN || document.getElementById("dashboardPayOverlay") || document.getElementById("dashboardUnpaidOverlay")){
            history.back();
          } else if (typeof appPlugin.exitApp === "function") {
            appPlugin.exitApp();
          }
        } catch(e){
          try { history.back(); } catch(_) {}
        }
      });
    }
  } catch(e){}
})();

window.addEventListener("popstate", function(e){
  // If the Mark-as-Paid modal is open, the hardware/browser back button
  // should just close it (it lives outside #root, so a plain render()
  // would never remove it on its own).
  closeAnyStrayModal();
  if (e.state) {
    VIEW = e.state.view || "home";
    VIEW_PARAM = e.state.param || null;
  } else {
    VIEW = "home";
    VIEW_PARAM = null;
  }
  render();
  window.scrollTo(0,0);
});

function render(){
  var root = document.getElementById("root");
  try {
    var html = "";
    html += renderTopbar();
    html += '<div class="content">' + renderView() + '</div>';
    html += renderNav();

    if (VIEW === "customerDetail" && VIEW_PARAM){
      root.innerHTML = html;
      renderCustomerDetailOverlay(VIEW_PARAM);
    } else if (VIEW === "addCustomer"){
      root.innerHTML = html;
      renderAddCustomerOverlay();
    } else if (VIEW === "editCustomer" && VIEW_PARAM){
      root.innerHTML = html;
      renderEditCustomerOverlay(VIEW_PARAM);
    } else {
      root.innerHTML = html;
    }
    attachGlobalHandlers();
  } catch(err){
    // Defensive fallback: one bad record (e.g. from a hand-edited backup)
    // should never freeze the whole app on a blank/broken screen. Drop back
    // to Home, which only needs the basics every customer record has.
    console.error("Render error, falling back to Home:", err);
    if (VIEW !== "home"){
      VIEW = "home"; VIEW_PARAM = null;
      try { render(); return; } catch(e2){ /* fall through to hard message below */ }
    }
    if (root) root.innerHTML = '<div class="loading">Something went wrong showing this screen. Try reloading the page.</div>';
  }
}

/* ============================= SEPARATE DUE PAYMENT FLOW ============================= */
function waDuePaymentMessage(c, stats, amount, penalty){
  var total = round2((amount || 0) + (penalty || 0));
  var remaining = Math.max(0, round2(stats.totalOutstanding - total));
  return [
    'Payment received — thank you, ' + c.name + '!',
    'Amount received: ' + inr(total),
    'Date: ' + fmtDate(todayISO()),
    'Remaining balance: ' + inr(remaining)
  ].join('\n');
}

function openReceiveDueModal(customerId){
  var c = DATA.customers.find(function(x){ return x.id === customerId; });
  if (!c){ showToast('Customer not found — it may have been moved or deleted.'); return; }
  var txns = DATA.transactions[c.id] || [];
  var s = computeStats(c, txns, DATA.settings);
  var duePrincipal = round2(s.todaysDueAmount);
  var duePenalty = round2(s.penaltyDue);
  var totalDue = round2(duePrincipal + duePenalty);
  if (totalDue <= 0.004){ showToast('No outstanding due for ' + c.name + '.'); return; }

  var wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'duePaymentOverlay';
  wrap.innerHTML = (
    '<div class="sheet">' +
      '<div class="sheet-header">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<button class="closebtn" data-close-due-payment="1" style="font-size:14px;">←</button>' +
          '<h2>Receive Due</h2>' +
        '</div>' +
        '<button class="closebtn" data-close-due-payment="1">✕</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="crow"><div class="name">' + escapeHtml(c.name) + '</div><span class="badge due">DUE</span></div>' +
        '<div class="grid2" style="margin-top:10px;">' +
          miniStat('Pending Amount', inr(duePrincipal)) +
          miniStat('Penalty Due', inr(duePenalty)) +
        '</div>' +
        '<div class="sub" style="margin-top:8px;">Total outstanding due: <b>' + inr(totalDue) + '</b></div>' +
        '<label>Payment Type</label>' +
        '<div class="feature-grid" style="margin-bottom:8px;">' +
          '<button type="button" class="btn btn-outline" id="dueFullBtn">🟢 Full Payment</button>' +
          '<button type="button" class="btn btn-outline" id="duePartialBtn">🟡 Partial Payment</button>' +
          '<button type="button" class="btn btn-outline" id="dueCustomBtn">🔵 Custom Amount</button>' +
        '</div>' +
        '<label>Due Amount Received (₹) *</label>' +
        '<input type="number" min="0" max="' + duePrincipal + '" step="0.01" id="duePayAmount" value="' + (duePrincipal > 0 ? duePrincipal : 0) + '">' +
        '<div class="btnrow" style="gap:6px;flex-wrap:wrap;">' +
          '<button type="button" class="btn btn-small btn-outline" data-due-quick="50">₹50</button>' +
          '<button type="button" class="btn btn-small btn-outline" data-due-quick="100">₹100</button>' +
          '<button type="button" class="btn btn-small btn-outline" data-due-quick="150">₹150</button>' +
          '<button type="button" class="btn btn-small btn-outline" data-due-quick="full">Full ₹' + duePrincipal + '</button>' +
        '</div>' +
        '<div id="dueRemainingPreview" class="helpline" style="font-weight:700;">Remaining after this payment: ' + inr(Math.max(0, duePrincipal - (duePrincipal > 0 ? duePrincipal : 0))) + '</div>' +
        '<div class="helpline">Partial payment is allowed. Example: ₹200 due → ₹150 received → ₹50 remaining. Later ₹50 can be received separately.</div>' +
        '<label>Penalty Received (₹)</label>' +
        '<input type="number" min="0" max="' + duePenalty + '" step="0.01" id="duePayPenalty" value="0">' +
        '<div class="btnrow">' +
          '<button class="btn btn-outline" data-close-due-payment="1">Cancel</button>' +
          '<button class="btn btn-primary" id="confirmDuePaymentBtn">Receive &amp; Save</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
  document.body.appendChild(wrap);
  try { history.pushState({view: VIEW, param: VIEW_PARAM}, '', ''); } catch(e){}
  var open = true;

  function dismissModal(){
    if (!wrap.isConnected) return;
    wrap.remove();
    if (open){ open = false; try { history.back(); } catch(e){} }
  }
  wrap.addEventListener('click', function(e){
    if (e.target.id === 'duePaymentOverlay' || e.target.hasAttribute('data-close-due-payment')) dismissModal();
  });

  var amountInput = document.getElementById('duePayAmount');
  var remainingPreview = document.getElementById('dueRemainingPreview');
  function updateDuePreview(){
    var entered = round2(parseFloat(amountInput.value) || 0);
    var rem = Math.max(0, round2(duePrincipal - entered));
    remainingPreview.textContent = 'Remaining after this payment: ' + inr(rem);
  }
  amountInput.addEventListener('input', updateDuePreview);
  document.getElementById('dueFullBtn').addEventListener('click', function(){ amountInput.value = duePrincipal; updateDuePreview(); });
  document.getElementById('duePartialBtn').addEventListener('click', function(){
    amountInput.focus();
    amountInput.select();
    showToast('Partial amount enter karo, jaise ₹150.');
  });
  document.getElementById('dueCustomBtn').addEventListener('click', function(){
    amountInput.value = '';
    amountInput.focus();
    updateDuePreview();
  });
  wrap.querySelectorAll('[data-due-quick]').forEach(function(qb){
    qb.addEventListener('click', function(){
      var v = qb.getAttribute('data-due-quick');
      amountInput.value = v === 'full' ? duePrincipal : Math.min(duePrincipal, Number(v) || 0);
      updateDuePreview();
    });
  });
  updateDuePreview();

  document.getElementById('confirmDuePaymentBtn').addEventListener('click', async function(){
    var btn = this;
    if (btn.disabled) return;
    var amount = round2(parseFloat(document.getElementById('duePayAmount').value) || 0);
    var penalty = round2(parseFloat(document.getElementById('duePayPenalty').value) || 0);
    if (amount <= 0 && penalty <= 0){ showToast('Enter an amount greater than zero.'); return; }
    if (amount > duePrincipal + 0.004){ showToast('Amount cannot be more than the current pending due.'); return; }
    if (penalty > duePenalty + 0.004){ showToast('Penalty received cannot be more than the penalty due.'); return; }
    btn.disabled = true;
    btn.textContent = 'Saving...';
    var result = await markPaid(c.id, amount, penalty);
    if (!result.ok){
      btn.disabled = false;
      btn.textContent = 'Receive & Save';
      showToast('Could not record payment — please try again.');
      return;
    }
    dismissModal();
    showToast('Due payment received: ' + inr(round2(amount + penalty)) + '.');
    render();
  });
}

/* ---------- Customers ---------- */
function renderCustomers(){
  var q = SEARCH_Q.trim().toLowerCase();
  var list = DATA.customers.filter(function(c){
    if (CUSTOMER_FILTER === "active"){
      if (c.archived) return false;
      // c.status is never updated away from "active" anywhere in the app —
      // check the computed completion state instead, or fully-paid plans
      // never leave the Active tab.
      var txnsAct = DATA.transactions[c.id] || [];
      if (computeStats(c, txnsAct, DATA.settings).isCompleted) return false;
    }
    if (CUSTOMER_FILTER === "completed"){
      var txns = DATA.transactions[c.id] || [];
      var s = computeStats(c, txns, DATA.settings);
      if (!s.isCompleted) return false;
    }
    if (CUSTOMER_FILTER === "pending"){
      var txns2 = DATA.transactions[c.id] || [];
      var s2 = computeStats(c, txns2, DATA.settings);
      if (!(s2.hasStarted && s2.todaysDue && !s2.isCompleted)) return false;
      if (c.archived) return false;
    }
    if (CUSTOMER_FILTER === "archived" && !c.archived) return false;
    if (CUSTOMER_FILTER === "all" && c.archived) return false;
    if (q){
      var hay = (c.name + " " + c.mobile + " " + c.id).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  list.sort(function(a,b){ return b.createdAt - a.createdAt; });

  var html = "";
  html += '<div class="searchbar"><input type="text" id="searchInput" placeholder="Search by name, mobile or ID" value="' + escapeHtml(SEARCH_Q) + '"></div>';
  html += '<div class="filterrow">';
  [["all","All"],["active","Active"],["pending","Pending Today"],["completed","Completed"],["archived","Archived"]].forEach(function(f){
    html += '<button class="chip' + (CUSTOMER_FILTER===f[0]?" active":"") + '" data-filter="' + f[0] + '">' + f[1] + '</button>';
  });
  html += '</div>';

  if (!list.length){
    html += '<div class="card empty">No customers match this view.</div>';
  }

  var paginatedList = list.slice(0, CUSTOMER_LIST_LIMIT);
  paginatedList.forEach(function(c){
    var txns = DATA.transactions[c.id] || [];
    var s = computeStats(c, txns, DATA.settings);
    var badge = c.archived ? '<span class="badge" style="background:#EEE;color:#888;">ARCHIVED</span>' :
      s.isCompleted ? '<span class="badge paid">COMPLETED</span>' :
      (s.hasStarted && s.todaysDue) ? '<span class="badge due">DUE</span>' : '<span class="badge paid">OK</span>';
    html += (
      '<div class="card" data-open-customer="' + c.id + '">' +
        '<div class="crow">' +
          '<div><div class="name">' + escapeHtml(c.name) + '</div>' +
          '<div class="sub">' + escapeHtml(c.mobile) + ' · Principal ' + inr(c.principal) + (isFivePlan(c) ? ' · ₹5,000 plan' : '') + '</div></div>' +
          badge +
        '</div>' +
        '<div class="sub" style="margin-top:6px;">Outstanding: ' + inr(s.totalOutstanding) + ' · Day ' + s.currentDayNumber + '/' + c.period +
        '</div>' +
        '<div class="btnrow" style="margin-top:10px;">' +
          '<button class="btn btn-outline btn-small" data-edit-customer="' + c.id + '">✏️ Edit</button>' +
          '<button class="btn btn-danger btn-small" data-move-trash="' + c.id + '">🗑️ Trash</button>' +
        '</div>' +
      '</div>'
    );
  });

  if (list.length > CUSTOMER_LIST_LIMIT){
    html += '<div class="btnrow"><button class="btn btn-outline" id="loadMoreBtn">Load More Customers (' + (list.length - CUSTOMER_LIST_LIMIT) + ' remaining)</button></div>';
  }

  return html;
}

function renderReports(){

    '<label>Report Month</label>' +
    '<input type="month" id="reportMonthInput" value="' + escapeHtml(REPORTS_MONTH) + '">' +
  '</div>';

  var monthCollected = 0, monthPenalty = 0, monthCount = 0;

      if (tx.date && tx.date.indexOf(ym) === 0){

  html += '<div class="section-title">Monthly Summary (' + ym + ')</div>';

    reportRow("Payments Recorded", monthCount) +

    reportRow("Total Customers", activeCustomers().length) +

    reportRow("Total Pending", inr(t.totalPendingAll)) +
    reportRow("Total Penalty (live)", inr(t.totalPenaltyAll)) +

  });

    '<div class="sheet">' +

        '<div style="display:flex;align-items:center;gap:8px;">' +

        '<div class="helpline">20% cut reference: <b id="f_cutPreview">₹0</b></div>' +
        '<label>Custom Penalty per Late Day (₹)</label><input type="number" min="0" step="0.01" id="f_penalty" max="10000000" placeholder="Leave blank to use default (' + (DATA.settings.penaltyPerDay||0) + ')">' +
        '<div class="helpline">Optional — set a different late-fee rate just for this customer. Leave blank to use the default rate from Settings.</div>' +
        '<label>Start Date *</label><input type="date" id="f_startDate" value="' + todayISO() + '">' +
        '<label>Notes</label><textarea id="f_notes" rows="2" placeholder="Optional"></textarea>' +
        '<div class="btnrow">' +
          '<button class="btn btn-outline" data-close-overlay="1">Cancel</button>' +
          '<button class="btn btn-primary" id="saveCustomerBtn">Save Customer</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
  root.appendChild(wrap);

  var mobileInput = document.getElementById("f_mobile");
  if (mobileInput){
    mobileInput.addEventListener("input", function(){
      this.value = this.value.replace(/\D/g, "").slice(0, 10);
    });
  }

  window.__cdmAutofillPlan = function(){
    var p = parseFloat(document.getElementById("f_principal").value) || 0;
    document.getElementById("f_cutPreview").textContent = inr(twentyPercentCut(p));
    if (p === 5000 && !document.getElementById("f_period").value){
      document.getElementById("f_period").value = 30;
      window.__cdmAutofillDaily();
    }
  };
  window.__cdmAutofillDaily = function(){
    var p = parseFloat(document.getElementById("f_principal").value) || 0;
    var per = parseFloat(document.getElementById("f_period").value, 10) || 0;
    if (p > 0 && per > 0){
      var exactDaily = p / per;
      document.getElementById("f_daily").value = exactDaily.toFixed(2);
    }
  };

  document.getElementById("saveCustomerBtn").addEventListener("click", async function(){
    var name = document.getElementById("f_name").value.trim();
    var mobile = document.getElementById("f_mobile").value.replace(/\D/g, "").slice(0, 10);
    var principal = parseFloat(document.getElementById("f_principal").value);
    var period = parseInt(document.getElementById("f_period").value, 10);
    var daily = parseFloat(document.getElementById("f_daily").value);
    var penaltyOverride = document.getElementById("f_penalty").value.trim();
    var startDate = document.getElementById("f_startDate").value;
    var notes = document.getElementById("f_notes").value;

    if (!name || !mobile || !principal || principal<=0 || !period || period<=0 || !daily || daily<=0 || !startDate){
      showToast("Please fill all required fields correctly.");
      return;
    }
    if (!validateMobile(mobile)){
      showToast("Please enter a valid 10-digit mobile number.");
      return;
    }

    this.disabled = true;
    await addCustomer({name:name, mobile:mobile, principal:principal, startDate:startDate, period:period, dailyAmount:daily, penaltyPerDay:penaltyOverride, notes:notes});
    showToast("Customer added successfully.");
    history.back();
  });

  wrap.addEventListener("click", function(e){
    if (e.target.id === "addOverlay" || e.target.hasAttribute("data-close-overlay")){
      history.back();
    }

/* ============================= MARK PAID FLOW ============================= */
function openMarkPaidModal(customerId){
  var c = DATA.customers.find(function(x){ return x.id === customerId; });
  if (!c){ showToast("Customer not found — it may have been moved or deleted."); return; }
  var txns = DATA.transactions[c.id] || [];
  var s = computeStats(c, txns, DATA.settings);
  var expected = round2(s.todaysDueAmount);
  var expectedPenalty = s.penaltyDue;

  var wrap = document.createElement("div");
  wrap.className = "overlay";
  wrap.id = "payOverlay";
  wrap.innerHTML = (
    '<div class="sheet">' +
      '<div class="sheet-header">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<button class="closebtn" data-close-pay="1" style="font-size:14px;">←</button>' +
          '<h2>Mark as Paid</h2>' +
        '</div>' +
        '<button class="closebtn" data-close-pay="1">✕</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="crow"><div class="name">' + escapeHtml(c.name) + '</div><span class="badge due">Day ' + s.currentDayNumber + '</span></div>' +
        '<div class="sub" style="margin-top:4px;">Expected due amount: ' + inr(expected) + '</div>' +
        '<label>Amount Received (₹) *</label><input type="number" min="0" step="0.01" id="payAmount" max="10000000" value="' + expected + '">' +
        '<div class="helpline">Entering more than the due amount will automatically apply the extra to upcoming day(s) as an advance.</div>' +
        '<label>Penalty Received (₹)</label><input type="number" min="0" step="0.01" id="payPenalty" max="10000000" value="' + expectedPenalty + '">' +
        '<div class="btnrow">' +
          '<button class="btn btn-outline" data-close-pay="1">Cancel</button>' +
          '<button class="btn btn-primary" id="confirmPayBtn">Confirm &amp; Save</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
  document.body.appendChild(wrap);

  // Push a history entry so the hardware/browser back button closes this
  // modal instead of skipping past the screen underneath it. See
  // closeAnyStrayModal() / the popstate handler for the other half of this.
  try { history.pushState({view: VIEW, param: VIEW_PARAM}, "", ""); } catch(e){}
  PAY_MODAL_OPEN = true;

  function dismissModal(){
    if (!wrap.isConnected) return; // already removed (e.g. by popstate)
    wrap.remove();
    if (PAY_MODAL_OPEN){
      PAY_MODAL_OPEN = false;
      try { history.back(); } catch(e){}
    }
  }

  wrap.addEventListener("click", function(e){
    if (e.target.id === "payOverlay" || e.target.hasAttribute("data-close-pay")) dismissModal();
  });

  document.getElementById("confirmPayBtn").addEventListener("click", async function(){
    var btn = this;
    if (btn.disabled) return;
    var amt = parseFloat(document.getElementById("payAmount").value);
    var pen = parseFloat(document.getElementById("payPenalty").value) || 0;
    if (!validMoneyAmount(amt,false) || !validMoneyAmount(pen,true)){ showToast("Enter valid amounts (maximum ₹1 crore)."); return; }
    var expectedNow = round2(expected);
    if (amt > expectedNow && (amt - expectedNow) >= Math.max(100, expectedNow * 2)){
      var extra = round2(amt - expectedNow);
      if (!confirm("You entered " + inr(amt) + ". Today's expected amount is " + inr(expectedNow) + ". Extra " + inr(extra) + " will be applied automatically to future days as advance. Continue?")){ return; }
    }
    btn.disabled = true;
    btn.textContent = "Saving...";
    var result = await markPaid(c.id, amt, pen);
    dismissModal();
    if (result.ok){
      if (result.advanceDays && result.advanceDays.length){
        showToast("Payment recorded — extra applied in advance to day(s) " + result.advanceDays.join(", ") + ".");
      } else if (result.leftoverAdvance > 0.004){
        showToast("Payment recorded. ₹" + result.leftoverAdvance + " extra couldn't be applied — plan is fully paid up.");
      } else {
        showToast("Payment recorded successfully.");
      }
    } else if (result && result.ok === false) {
      showToast("Could not record payment — please try again.");
    }
    render();
  });
}

/* ============================= BACKUP / RESTORE ============================= */
function exportBackup(){
  var payload = {
    exportedAt: new Date().toISOString(),
    app: "daily-collection-manager",
    data: DATA
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "collection-backup-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast("Backup exported.");
}

function importBackup(file){
  if (!file){ showToast("Choose a backup file first."); return; }
  var reader = new FileReader();
  reader.onload = async function(e){
    try{
      var parsed = JSON.parse(e.target.result);
      var incoming = parsed.data || parsed;
      if (!incoming || !Array.isArray(incoming.customers)){
        showToast("Invalid backup file.");
        return;
      }
      var proceed = confirm("Restoring will replace all current data. Continue?");
      if (!proceed) return;
      DATA = {
        customers: incoming.customers || [],
        transactions: incoming.transactions || {},
        trash: incoming.trash || [],
        expenses: incoming.expenses || [],
        expenseTrash: incoming.expenseTrash || [],
        settings: Object.assign(defaultData().settings, incoming.settings || {}),
        version: incoming.version || 2
      };
      migrateShailuData();
      await saveData(DATA);
      showToast("Backup restored successfully.");
      setView("home");
    }catch(err){
      showToast("Could not read backup file.");
    }
  };
  reader.readAsText(file);
}

      "Name": c.name,
      "Mobile": c.mobile,
      "Principal Amount": c.principal,
      "Start Date": c.startDate,
      "Collection Period (days)": c.period,
      "Daily Amount": c.dailyAmount,

    };
  });
  var trashTxnRows = [];

      "Timestamp": e.timestamp ? new Date(e.timestamp).toISOString() : ""
    };
  });

function importExcel(file){
  if (!file){ showToast("Choose an Excel (.xlsx) file first."); return; }
  if (typeof XLSX === "undefined"){
    showToast("Excel library failed to load — check your internet connection and try again.");
    return;
  }
  var reader = new FileReader();
  reader.onload = async function(e){
    try{
      var wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      var custSheet = wb.Sheets["Customers"];
      if (!custSheet){
        showToast("This Excel file has no 'Customers' sheet — is it a valid export?");
        return;
      }
      var custRows = XLSX.utils.sheet_to_json(custSheet, {defval:""});
      var newCustomers = custRows.map(function(r){
        return {
          id: String(r["Customer ID"] || uid("cust")),
          name: String(r["Name"] || "").trim(),
          mobile: String(r["Mobile"] || "").trim(),
          principal: round2(parseFloat(r["Principal Amount"]) || 0),
          startDate: sanitizeDateStr(r["Start Date"], todayISO()),
          period: Math.max(1, Math.round(parseFloat(r["Collection Period (days)"]) || 1)),
          dailyAmount: round2(parseFloat(r["Daily Amount"]) || 0),
          penaltyPerDay: (r["Custom Penalty/Day"] === "" || r["Custom Penalty/Day"] == null) ? null : round2(parseFloat(r["Custom Penalty/Day"]) || 0),
          status: String(r["Status"] || "active"),
          archived: String(r["Archived"] || "No").toLowerCase() === "yes",
          notes: String(r["Notes"] || ""),
          createdAt: r["Created At"] ? new Date(r["Created At"]).getTime() : Date.now()
        };
      });

      var newTransactions = {};
      var txnSheet = wb.Sheets["Transactions"];
      if (txnSheet){
        var txnRows = XLSX.utils.sheet_to_json(txnSheet, {defval:""});
        txnRows.forEach(function(r){
          var cid = String(r["Customer ID"] || "");
          if (!cid) return;
          if (!newTransactions[cid]) newTransactions[cid] = [];
          newTransactions[cid].push({
            id: uid("txn"),
            dayNumber: Math.round(parseFloat(r["Day Number"]) || 0),
            amountPaid: round2(parseFloat(r["Amount Paid"]) || 0),
            penaltyPaid: round2(parseFloat(r["Penalty Paid"]) || 0),
            date: String(r["Date"] || ""),
            timestamp: r["Timestamp"] ? new Date(r["Timestamp"]).getTime() : Date.now(),
            isCorrection: String(r["Is Correction"] || "No").toLowerCase() === "yes",
            isUnpaid: String(r["Unpaid"] || "No").toLowerCase() === "yes",
            note: String(r["Note"] || "")
          });
        });
      }

      var newTrash = [];
      var trashSheet = wb.Sheets["Trash"];
      if (trashSheet){
        var trashRows = XLSX.utils.sheet_to_json(trashSheet, {defval:""});
        var trashTxnSheet = wb.Sheets["Trash Transactions"];
        var trashTxnByCustomer = {};
        if (trashTxnSheet){
          XLSX.utils.sheet_to_json(trashTxnSheet, {defval:""}).forEach(function(r){
            var cid=String(r["Customer ID"]||""); if(!cid) return;
            if(!trashTxnByCustomer[cid]) trashTxnByCustomer[cid]=[];
            trashTxnByCustomer[cid].push({id:uid("txn"),dayNumber:Math.round(parseFloat(r["Day Number"])||0),amountPaid:round2(parseFloat(r["Amount Paid"])||0),penaltyPaid:round2(parseFloat(r["Penalty Paid"])||0),date:String(r["Date"]||""),timestamp:r["Timestamp"]?new Date(r["Timestamp"]).getTime():Date.now(),isCorrection:String(r["Is Correction"]||"No").toLowerCase()==="yes",isUnpaid:String(r["Unpaid"]||"No").toLowerCase()==="yes",note:String(r["Note"]||"")});
          });
        }
        newTrash = trashRows.map(function(r){
          var cid=String(r["Customer ID"]||uid("cust"));
          return {
            customer: {id:cid,name:String(r["Name"]||"").trim(),mobile:String(r["Mobile"]||"").trim(),principal:round2(parseFloat(r["Principal Amount"])||0),startDate:sanitizeDateStr(r["Start Date"],todayISO()),period:Math.max(1,Math.round(parseFloat(r["Collection Period (days)"])||1)),dailyAmount:round2(parseFloat(r["Daily Amount"])||0),status:"active",archived:false,notes:String(r["Notes"]||""),createdAt:r["Created At"]?new Date(r["Created At"]).getTime():Date.now()},
            transactions: trashTxnByCustomer[cid] || [], deletedAt: Date.now()
          };
        });
      }

      var newExpenses = [];
      var expenseSheet = wb.Sheets["Expenses"];
      if (expenseSheet){
        var expenseRows = XLSX.utils.sheet_to_json(expenseSheet, {defval:""});
        newExpenses = expenseRows.map(function(r){

            date: String(r["Date"] || todayISO()),
            timestamp: r["Timestamp"] ? new Date(r["Timestamp"]).getTime() : Date.now()
          };
        });
      }

      var proceed = confirm("Restoring from Excel will replace all current data. Continue?");
      if (!proceed) return;

      DATA = {
        customers: newCustomers,
        transactions: newTransactions,
        trash: newTrash,
        expenses: newExpenses,
        expenseTrash: DATA.expenseTrash || [], // Excel has no Expense-Trash sheet — keep what was already there instead of wiping it
        settings: DATA.settings,
        version: DATA.version || 2
      };
      migrateShailuData();
      await saveData(DATA);
      showToast("Data restored from Excel successfully.");
      setView("home");
    }catch(err){
      console.error(err);
      showToast("Could not read that Excel file — is it a valid export?");
    }
  };

/* ============================= SHAILU BHAI PRO UPGRADE ============================= */
function migrateShailuData(){
  if (!DATA) return;
  if (!DATA.settings) DATA.settings = defaultData().settings;
  if (!DATA.customers) DATA.customers = [];
  if (!DATA.transactions) DATA.transactions = {};
  if (!DATA.dashboardPayments) DATA.dashboardPayments = {};
  if (!DATA.trash) DATA.trash = [];
  if (!DATA.expenses) DATA.expenses = [];
  if (!DATA.expenseTrash) DATA.expenseTrash = [];
  var changed = false;
  DATA.customers.forEach(function(c, i){
    if (!c.personId){ c.personId = 'person_' + String((c.mobile||'').replace(/\D/g,'')) + '_' + (c.createdAt || i); changed = true; }
    if (!c.bookId){ c.bookId = c.id; changed = true; }
    if (!c.bookNo){ c.bookNo = 'BOOK-' + String(i+1).padStart(4,'0'); changed = true; }
    if (!c.bookTitle){ c.bookTitle = 'Loan / Book'; changed = true; }
  });
  (DATA.trash||[]).forEach(function(item, i){
    var c=item.customer||{};
    if (!c.personId) c.personId='person_'+String((c.mobile||'').replace(/\D/g,''))+'_trash_'+i;
    if (!c.bookId) c.bookId=c.id||uid('book');
    if (!c.bookNo) c.bookNo='TRASH-'+String(i+1).padStart(4,'0');
  });
  if (!DATA.nextBookNo) DATA.nextBookNo = DATA.customers.length + 1;
  DATA.version = Math.max(Number(DATA.version||0), 5);
  return changed;
}

function uniquePeopleCount(list){
  var seen={}; (list||[]).forEach(function(c){ if(c && c.archived!==true) seen[c.personId||c.id]=true; });
  return Object.keys(seen).length;
}
function personLoans(c){
  if(!c) return [];
  return DATA.customers.filter(function(x){ return (x.personId||x.id)===(c.personId||c.id); }).sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
}
function nextBookNumber(){
  var n=Number(DATA.nextBookNo||1); DATA.nextBookNo=n+1; return 'BOOK-'+String(n).padStart(4,'0');
}
async function addBookForCustomer(sourceId, payload){
  if (!beginMutation()) return null;
  try{
    var source=DATA.customers.find(function(x){return x.id===sourceId;});
    var principal=round2(Number(payload.principal)), daily=round2(Number(payload.dailyAmount));
    if(!source || !validateMobile(payload.mobile) || !validMoneyAmount(principal,false) || !validMoneyAmount(daily,false)){
      showToast("Please enter valid book details and amounts (maximum ₹1 crore).");
      return null;
    }
    var c={
      id:uid('cust'), personId:source.personId||source.id, bookId:uid('book'), bookNo:nextBookNumber(),
      bookTitle:(payload.bookTitle||'Loan / Book').trim(), name:payload.name.trim(), mobile:String(payload.mobile||'').replace(/\D/g,'').slice(0,10),
      principal:principal, startDate:sanitizeDateStr(payload.startDate,todayISO()),
      period:Math.max(1,Math.round(payload.period)||1), dailyAmount:daily,
      penaltyPerDay:normalizePenaltyOverride(payload.penaltyPerDay), notes:payload.notes?payload.notes.trim():'',
      status:'active', archived:false, createdAt:Date.now(), reopenedFrom:source.id
    };
    DATA.customers.push(c); DATA.transactions[c.id]=[];
    var saved=await saveData(DATA);
    if(!saved){ DATA.customers.pop(); delete DATA.transactions[c.id]; return null; }
    return c;
  } finally { endMutation(); }
}

function shailuTodayRows(){
  var paid=[], pending=[];
  activeCustomers().forEach(function(c){
    var txns=DATA.transactions[c.id]||[], s=computeStats(c,txns,DATA.settings);

    /*
     * DASHBOARD PAID/UNPAID IS A SEPARATE SYSTEM.
     * If Home/Dashboard was marked Paid, show that customer immediately in
     * Today's Collection. Do NOT create/read a Ledger transaction here.
     */
    var dp=getDashboardPayment(c,s);
    var dashboardPaid=!!(dp && dp.status==='paid' && Number(dp.amount||0)>0);
    if(dashboardPaid){
      paid.push({
        c:c,
        s:s,
        amount:round2(dp.amount||0),
        penalty:0,
        timestamp:dp.timestamp||Date.now(),
        days:[Number(s.currentDayNumber)],
        lastTxnId:null,
        todayUnpaidKey:true,
        dashboardOnly:true
      });
    } else {
      /* Existing Ledger payment display remains untouched. */
      var effectiveTx=effectiveTransactions(txns);
      var todayTx=effectiveTx.filter(function(t){return t.date===todayISO() && Number(t.dayNumber)===Number(s.currentDayNumber);});
      var amt=round2(todayTx.reduce(function(a,t){return a+(t.amountPaid||0);},0));
      var pen=round2(todayTx.reduce(function(a,t){return a+(t.penaltyPaid||0);},0));
      if(amt>0.004){
        var originals=todayTx.filter(function(t){ return !t.isCorrection; }).sort(function(a,b){ return (b.timestamp||0)-(a.timestamp||0); });
        paid.push({
          c:c,
          s:s,
          amount:amt,
          penalty:pen,
          timestamp: todayTx.length ? Math.max.apply(null, todayTx.map(function(t){ return t.timestamp||0; })) : Date.now(),
          days: originals.map(function(t){ return t.dayNumber; }).sort(function(a,b){ return a-b; }),
          lastTxnId: originals.length ? originals[0].id : null,
          todayUnpaidKey: false,
          dashboardOnly:false
        });
      }
    }

    /*
     * Dashboard pending must also show old Ledger dues. A customer can have
     * today's Dashboard status paid while an older Ledger day is still unpaid;
     * in that case the old due must remain visible.
     */
    if(s.pendingDayNumbers.length && !dashboardPaid) pending.push({c:c,s:s});
  });
  return {paid:paid,pending:pending};
}

function last15DayRows(){
  var out=[]; var base=new Date(); base.setHours(0,0,0,0);
  for(var i=0;i<15;i++){
    var d=new Date(base); d.setDate(base.getDate()-i); var iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var total=0,count=0,pen=0;
    DATA.customers.forEach(function(c){ effectiveTransactions(DATA.transactions[c.id]||[]).forEach(function(t){ if(t.date===iso && (t.amountPaid||0)>0){ total+=t.amountPaid; count++; pen+=(t.penaltyPaid||0); } }); });
    var exp=(DATA.expenses||[]).filter(function(e){return e.date===iso;}).reduce(function(a,e){return a+(e.amount||0);},0);
    out.push({date:iso,total:round2(total),count:count,penalty:round2(pen),expense:round2(exp),net:round2(total-exp)});
  }
  return out;
}

function todayTotals(){
  var totalCollectedToday=0,totalPendingToday=0,totalPenaltyCollectedToday=0,totalPenaltyLiveToday=0,customersDueToday=0;
  var totalTodayScheduled=0,totalDashboardPaidToday=0;
  var totalPrincipal=0,totalCollectedAll=0,totalPendingAll=0,totalPenaltyAll=0;
  activeCustomers().forEach(function(c){
    var tx=DATA.transactions[c.id]||[],s=computeStats(c,tx,DATA.settings);
    totalPrincipal+=c.principal; totalCollectedAll+=s.totalCollected; totalPendingAll+=s.totalPending; totalPenaltyAll+=s.penaltyDue;
    var todaysTx=effectiveTransactions(tx).filter(function(t){return t.date===todayISO();});
    // Dashboard "today" means the customer's CURRENT day, not merely a
    // transaction entered today. A late/backlog payment entered today for an
    // older day must stay attached to that older day and must NOT reduce
    // today's scheduled amount.
    var currentDayTx=todaysTx.filter(function(t){return Number(t.dayNumber)===Number(s.currentDayNumber);});
    var netAmountToday=round2(currentDayTx.reduce(function(sum,t){return sum+(t.amountPaid||0);},0));
    var netPenaltyToday=round2(currentDayTx.reduce(function(sum,t){return sum+(t.penaltyPaid||0);},0));

    /* Aaj ki actual collection list: active, not-completed customers who are due today. */
    var dueToday=dashboardIsDue(c,s);
    if(dueToday){
      customersDueToday++;
      totalTodayScheduled+=dashboardDueAmount(c,s);
      var dp=getDashboardPayment(c,s);
      if(dp && dp.status==="paid"){
        totalDashboardPaidToday+=Math.min(round2(c.dailyAmount||0),round2(dp.amount||0));
      }
    }

    if(s.hasStarted&&!s.isCompleted&&s.todaysDue){
      totalPendingToday+=round2(s.todaysDueAmount);
      totalPenaltyLiveToday+=round2(s.penaltyDue||0);
    }
    if(netAmountToday>0.004){
      totalCollectedToday+=netAmountToday;
      totalPenaltyCollectedToday+=netPenaltyToday;
    }
  });
  var expensesToday=(DATA.expenses||[]).filter(function(e){return e.date===todayISO();}).reduce(function(a,e){return a+(e.amount||0);},0);
  var due=round2(totalCollectedToday+totalPendingToday),col=round2(totalCollectedToday),net=round2(col-expensesToday);
  var totalTodayRemaining=Math.max(0,round2(totalTodayScheduled-totalDashboardPaidToday));
  return {
    customersDueToday:customersDueToday,
    totalTodayScheduled:round2(totalTodayScheduled),
    totalTodayRemaining:totalTodayRemaining,
    dashboardCollectedToday:round2(totalDashboardPaidToday),
    dashboardPendingToday:Math.max(0,round2(totalTodayScheduled-totalDashboardPaidToday)),
    totalDueToday:due,
    totalCollected:col,
    totalPendingToday:round2(totalPendingToday),
    totalPenaltyToday:round2(totalPenaltyLiveToday+totalPenaltyCollectedToday),
    collectionPercent:due>0?round2(col/due*100):(col>0?100:0),
    totalPrincipal:round2(totalPrincipal),
    totalCollectedAll:round2(totalCollectedAll),
    totalPendingAll:round2(totalPendingAll),
    totalPenaltyAll:round2(totalPenaltyAll),
    totalOutstandingAll:round2(totalPendingAll+totalPenaltyAll),
    expensesToday:round2(expensesToday),
    netCashToday:net,
    marketOutstanding:round2(totalPendingAll+totalPenaltyAll),
    uniqueCustomers:uniquePeopleCount(activeCustomers()),
    loanCount:activeCustomers().length
  };
}

function historicalMessageReportData(dateStr){
  var paid=[], unpaid=[], paidTotal=0, unpaidTotal=0;
  var selected = new Date(dateStr + 'T00:00:00');

  DATA.customers.forEach(function(c){
    var txns=DATA.transactions[c.id]||[];
    var effective=effectiveTransactions(txns);

    /* For the selected date, paid means money actually recorded on that date.
       Corrections / Mark-Unpaid entries are already removed by effectiveTransactions(). */
    var datePaid=round2(effective.filter(function(t){
      return String(t.date||'').slice(0,10)===dateStr;
    }).reduce(function(a,t){ return a+(t.amountPaid||0); },0));

    /* Dashboard Paid is intentionally separate from Ledger. For today's
       Message Centre, mirror the Dashboard status if it exists. */
    var dashboardPaid=0, dashboardToday=false;
    if(dateStr===todayISO()){
      var dayStats=computeStats(c,effective,DATA.settings);
      var dp=getDashboardPayment(c,dayStats);
      if(dp && dp.status==='paid' && Number(dp.amount||0)>0){
        dashboardPaid=round2(dp.amount||0);
        dashboardToday=true;
      }
    }

    var paidAmount = dashboardToday ? dashboardPaid : datePaid;
    if(paidAmount>0.004){
      paid.push({c:c,amount:paidAmount});
      paidTotal=round2(paidTotal+paidAmount);
    }

    /* Unpaid is the selected calendar day's scheduled collection.
       Payments allocated to that day on or before the selected date count
       toward it; later payments do not. */
    var start=new Date(c.startDate+'T00:00:00');
    var day=Math.floor((selected-start)/86400000)+1;
    if(day<1 || day>Number(c.period||0)) return;

    var dayPaid=round2(effective.filter(function(t){
      var td=String(t.date||'').slice(0,10);
      return Number(t.dayNumber)===day && td && td<=dateStr;
    }).reduce(function(a,t){ return a+(t.amountPaid||0); },0));

    var dayShortfall=Math.max(0,round2(Number(c.dailyAmount||0)-dayPaid));

    /*
     * On today's report, Dashboard Paid settles today's dashboard status but
     * does not alter the Ledger. Keep any older Ledger backlog visible.
     */
    if(dashboardToday){
      dayShortfall = 0;
    }

    /* Older unpaid Ledger days are still relevant on today's dashboard/report. */
    if(dateStr===todayISO()){
      var sToday=computeStats(c,effective,DATA.settings);
      dayShortfall=round2((sToday.backlogAmount||0) + (dashboardToday ? 0 : dayShortfall));
    }

    if(dayShortfall>0.004){
      unpaid.push({c:c,amount:dayShortfall,dayNumber:day});
      unpaidTotal=round2(unpaidTotal+dayShortfall);
    }
  });

  var expenses=(DATA.expenses||[]).filter(function(e){
    return String(e.date||'').slice(0,10)===dateStr;
  }).map(function(e){
    return {
      title:e.name||e.title||e.category||'Expense',
      note:e.note||'',
      amount:round2(e.amount||0)
    };
  });
  var expenseTotal=round2(expenses.reduce(function(a,e){return a+e.amount;},0));
  return {
    paid:paid,
    unpaid:unpaid,
    paidTotal:paidTotal,
    unpaidTotal:unpaidTotal,
    expenses:expenses,
    expenseTotal:expenseTotal
  };
}

function shiftMonthsISO(iso, delta){
  var p=String(iso||todayISO()).split('-').map(Number);
  var d=new Date(Date.UTC(p[0], (p[1]||1)-1, p[2]||1));
  d.setUTCMonth(d.getUTCMonth()+delta);
  return d.toISOString().slice(0,10);
}
function lastSixMonthsStartISO(){ return shiftMonthsISO(todayISO(), -6); }
function isWithinLastSixMonths(dateStr){
  var d=String(dateStr||'').slice(0,10), today=todayISO();
  return !!d && d>=lastSixMonthsStartISO() && d<=today;
}
function dailyCollectionRowsForDate(dateStr){
  var byCustomer={};
  DATA.customers.forEach(function(c){
    effectiveTransactions(DATA.transactions[c.id]||[]).forEach(function(tx){
      if (String(tx.date||'').slice(0,10)!==dateStr) return;
      var amount=round2(tx.amountPaid||0);
      var penalty=round2(tx.penaltyPaid||0);
      if (!byCustomer[c.id]) byCustomer[c.id]={c:c,amount:0,penalty:0,count:0};
      byCustomer[c.id].amount=round2(byCustomer[c.id].amount+amount);
      byCustomer[c.id].penalty=round2(byCustomer[c.id].penalty+penalty);
      if (amount||penalty) byCustomer[c.id].count++;
    });
  });
  return Object.keys(byCustomer).map(function(id){return byCustomer[id];})
    .filter(function(r){return Math.abs(r.amount)>0.004 || Math.abs(r.penalty)>0.004;})
    .sort(function(a,b){return a.c.name.localeCompare(b.c.name);});
}
function dailyCollectionMessage(dateStr){
  var rows=dailyCollectionRowsForDate(dateStr), total=0, penalty=0;
  rows.forEach(function(r){total=round2(total+r.amount);penalty=round2(penalty+r.penalty);});
  var lines=['Daily Collection Report — '+fmtDate(dateStr),''];
  if(rows.length){
    lines.push('CUSTOMERS ('+rows.length+')');
    rows.forEach(function(r,i){
      lines.push((i+1)+'. '+r.c.name+' — '+inr(r.amount)+(r.penalty?' + Penalty '+inr(r.penalty):''));
    });
  } else lines.push('No collection recorded for this day.');
  lines.push('', 'Total Collection: '+inr(total), 'Total Penalty: '+inr(penalty), 'Net Recorded: '+inr(round2(total+penalty)));
  return lines.join('\\n');
}
function dailyActivityRowsSixMonths(){
  var map={};
  DATA.customers.forEach(function(c){
    effectiveTransactions(DATA.transactions[c.id]||[]).forEach(function(tx){
      var d=String(tx.date||'').slice(0,10);
      if(!isWithinLastSixMonths(d)) return;
      var a=round2(tx.amountPaid||0), p=round2(tx.penaltyPaid||0);
      if(!map[d]) map[d]={date:d,total:0,penalty:0,customers:{}};
      map[d].total=round2(map[d].total+a);
      map[d].penalty=round2(map[d].penalty+p);
      map[d].customers[c.id]=true;
    });
  });
  return Object.keys(map).sort().reverse().map(function(d){
    var r=map[d];
    return {date:d,total:round2(r.total),penalty:round2(r.penalty),customerCount:Object.keys(r.customers).length};
  });
}

/* ============================= BOOT ============================= */
async function boot(){
  try {
    DATA = await loadData();
    if (!DATA.settings) DATA.settings = defaultData().settings;
    migrateShailuData();
    await saveData(DATA);
    if (!DATA.customers) DATA.customers = [];
    if (!DATA.transactions) DATA.transactions = {};
    if (!DATA.trash) DATA.trash = [];
    if (!DATA.expenses) DATA.expenses = [];
    if (!DATA.expenseTrash) DATA.expenseTrash = [];
    try {
      history.replaceState({view: "home", param: null}, "", "");
    } catch(e){}
    render();
  } catch(err){
    // Last-resort fallback so the app never gets stuck on the loading
    // screen forever if storage init throws for an unexpected reason.
    usingFallback = true;
    DATA = defaultData();
    try { render(); } catch(e2){
      var root = document.getElementById("root");
      if (root) root.innerHTML = '<div class="loading">Something went wrong loading your data. Please reload the page.</div>';
    }
  }
}
boot();
