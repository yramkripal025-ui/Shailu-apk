name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk
          check-latest: true

      - name: Verify Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | grep -oE '"?[0-9]+' | head -n 1 | tr -d '"')

          if [ "$JAVA_MAJOR" != "21" ]; then
            echo "ERROR: Java 21 is not active."
            exit 1
          fi

          if ! javac -version 2>&1 | grep -q "21"; then
            echo "ERROR: javac 21 is not active."
            exit 1
          fi

      - name: Prepare web directory
        run: |
          mkdir -p www
          cp index.html www/index.html
          test -f www/index.html
          ls -lh www/index.html

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project
        run: npm run validate

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Gradle Java
        working-directory: android
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          ./gradlew -version

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Check APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shailu-Bhai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
